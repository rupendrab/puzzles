<!DOCTYPE html>
<html>
<head>
    <title>3D View 2</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { width: 100%; height: 100%; display: block; }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.88);
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>Controls:</strong><br>
        • Left-Click & Drag: Rotate manually<br>
        • Scroll Wheel: Zoom in/out<br>
        • Left-Click once (tap): Pause/Restart auto-rotation<br>
        • Shape used: one continuous polyhedron with two sloped faces and one flat top face
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let isRotating = true;
        let pointerDown = false;
        let dragDistance = 0;
        let pointerStart = { x: 0, y: 0 };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4.6, 4.1, 5.6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0.4, 0.8, 0.6);
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 8, 6);
        scene.add(dirLight);

        function pushQuad(positions, a, b, c, d) {
            positions.push(...a, ...b, ...c, ...a, ...c, ...d);
        }

        function addEdge(positions, a, b) {
            positions.push(...a, ...b);
        }

        function buildGeometry() {
            const positions = [];

            const b0 = [-0.5, 0.0, -0.5];
            const b1 = [ 0.5, 0.0, -0.5];
            const b2 = [ 0.5, 0.0,  0.5];
            const b3 = [ 1.5, 0.0,  0.5];
            const b4 = [ 1.5, 0.0,  1.5];
            const b5 = [ 0.5, 0.0,  1.5];
            const b6 = [-0.5, 0.0,  1.5];
            const b7 = [-0.5, 0.0,  0.5];

            const t0 = [-0.5, 1.0, -0.5];
            const t1 = [ 0.5, 1.0, -0.5];
            const t2 = [ 0.5, 2.0,  0.5];
            const t3 = [ 1.5, 1.0,  0.5];
            const t4 = [ 1.5, 1.0,  1.5];
            const t5 = [ 0.5, 2.0,  1.5];
            const t6 = [-0.5, 2.0,  1.5];
            const t7 = [-0.5, 2.0,  0.5];

            // Bottom
            pushQuad(positions, b0, b1, b2, b7);
            pushQuad(positions, b7, b2, b5, b6);
            pushQuad(positions, b2, b3, b4, b5);

            // Vertical outer walls
            pushQuad(positions, b0, b1, t1, t0);
            pushQuad(positions, b1, b2, t2, t1);
            pushQuad(positions, b2, b3, t3, t2);
            pushQuad(positions, b3, b4, t4, t3);
            pushQuad(positions, b4, b5, t5, t4);
            pushQuad(positions, b5, b6, t6, t5);
            pushQuad(positions, b6, b7, t7, t6);
            pushQuad(positions, b7, b0, t0, t7);

            // Top surfaces: front slope, flat center/back top, right slope
            pushQuad(positions, t0, t1, t2, t7);
            pushQuad(positions, t7, t2, t5, t6);
            pushQuad(positions, t2, t3, t4, t5);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            geometry.computeVertexNormals();
            return geometry;
        }

        function buildEdgesGeometry() {
            const positions = [];

            const b0 = [-0.5, 0.0, -0.5];
            const b1 = [ 0.5, 0.0, -0.5];
            const b2 = [ 0.5, 0.0,  0.5];
            const b3 = [ 1.5, 0.0,  0.5];
            const b4 = [ 1.5, 0.0,  1.5];
            const b6 = [-0.5, 0.0,  1.5];
            const b7 = [-0.5, 0.0,  0.5];

            const t0 = [-0.5, 1.0, -0.5];
            const t1 = [ 0.5, 1.0, -0.5];
            const t2 = [ 0.5, 2.0,  0.5];
            const t3 = [ 1.5, 1.0,  0.5];
            const t4 = [ 1.5, 1.0,  1.5];
            const t5 = [ 0.5, 2.0,  1.5];
            const t6 = [-0.5, 2.0,  1.5];
            const t7 = [-0.5, 2.0,  0.5];

            // Outer footprint
            addEdge(positions, b0, b1);
            addEdge(positions, b1, b2);
            addEdge(positions, b2, b3);
            addEdge(positions, b3, b4);
            addEdge(positions, b4, b6);
            addEdge(positions, b6, b7);
            addEdge(positions, b7, b0);

            // Outer verticals
            addEdge(positions, b0, t0);
            addEdge(positions, b1, t1);
            addEdge(positions, b3, t3);
            addEdge(positions, b4, t4);
            addEdge(positions, b6, t6);
            addEdge(positions, b7, t7);

            // Top outer boundary and real seams
            addEdge(positions, t0, t1);
            addEdge(positions, t1, t2);
            addEdge(positions, t2, t3);
            addEdge(positions, t3, t4);
            addEdge(positions, t4, t5);
            addEdge(positions, t5, t6);
            addEdge(positions, t6, t7);
            addEdge(positions, t7, t0);

            // Real seam lines between the three top faces
            addEdge(positions, t7, t2);
            addEdge(positions, t2, t5);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            return geometry;
        }

        const model = new THREE.Group();
        scene.add(model);

        const mesh = new THREE.Mesh(
            buildGeometry(),
            new THREE.MeshStandardMaterial({
                color: 0x4d8bd6,
                roughness: 0.5,
                metalness: 0.05
            })
        );
        model.add(mesh);

        const edges = new THREE.LineSegments(
            buildEdgesGeometry(),
            new THREE.LineBasicMaterial({ color: 0x111111 })
        );
        model.add(edges);

        const floor = new THREE.GridHelper(8, 8, 0xb7b7b7, 0xd9d9d9);
        floor.position.y = -0.01;
        scene.add(floor);

        renderer.domElement.addEventListener("pointerdown", (event) => {
            pointerDown = true;
            dragDistance = 0;
            pointerStart = { x: event.clientX, y: event.clientY };
        });

        renderer.domElement.addEventListener("pointermove", (event) => {
            if (!pointerDown) {
                return;
            }

            dragDistance = Math.max(
                dragDistance,
                Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y)
            );
        });

        renderer.domElement.addEventListener("pointerup", () => {
            if (pointerDown && dragDistance < 5) {
                isRotating = !isRotating;
            }

            pointerDown = false;
        });

        renderer.domElement.addEventListener("pointerleave", () => {
            pointerDown = false;
        });

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            if (isRotating) {
                model.rotation.y += 0.003;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
